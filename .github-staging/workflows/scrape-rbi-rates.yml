name: Scrape RBI/FBIL Reference Rates

# Runs every 15 min between 03:30-13:00 UTC (09:00-18:30 IST) on weekdays.
# FBIL publishes the daily reference rate at 13:30 IST, so we start before and
# keep polling to catch the publication + intraday changes.
# Also exposes workflow_dispatch for manual triggers.
on:
  schedule:
    - cron: '*/15 3-13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Need push permission to commit back
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape rates
        run: python scripts/scrape_rbi_fbil.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit if changed
        run: |
          git config user.name  "fxrm-rate-bot"
          git config user.email "fxrm-rate-bot@users.noreply.github.com"
          git add public-rates/latest.json public-rates/history/
          if git diff --cached --quiet; then
            echo "No rate changes"
          else
            git commit -m "chore(rates): auto-scrape $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
