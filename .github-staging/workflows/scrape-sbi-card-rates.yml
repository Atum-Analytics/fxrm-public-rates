name: Scrape SBI Forex Card Rates

# SBI publishes their card rates PDF once per business day, usually in the morning
# (around 10:30-11:00 IST). We poll every 30 minutes between 04:00-13:00 UTC
# (09:30-18:30 IST) Mon-Fri to catch the publication + any intraday revision.
on:
  schedule:
    - cron: '*/30 4-13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pdfplumber

      - name: Scrape SBI rates
        run: python scripts/scrape_sbi_card_rates.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit if changed
        run: |
          git config user.name  "fxrm-rate-bot"
          git config user.email "fxrm-rate-bot@users.noreply.github.com"
          git add public-rates/sbi-latest.json public-rates/history/sbi_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No SBI rate changes"
          else
            git commit -m "chore(sbi): auto-scrape SBI card rates $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
